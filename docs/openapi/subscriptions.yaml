openapi: 3.0.3
info:
  title: WalkerBook — Subscriptions (contract)
  description: >
    Mounted under /api/v1 on the Go backend. Browser calls these via Next.js
    /api/go/v1/subscriptions/...
  version: 1.0.0

paths:
  /api/v1/subscriptions:
    post:
      summary: Create a subscription row for the current user
      description: >
        Records a one-time plan purchase (single_book, double_book, triple_book).
        Initial books_remaining is 1, 2, or 3 by plan. When full book generation
        completes, the server decrements credits and may set expired when none remain.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [single_book, double_book, triple_book]
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      summary: List subscriptions for the current user
      description: Newest first.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/subscriptions/active-check:
    get:
      summary: Whether the user has book credits left on a subscription
      description: >
        True when there is a non-expired row with books_remaining > 0
        (newest entitlement). Uses Bearer JWT subject as user id.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active subscription flag
          content:
            application/json:
              schema:
                type: object
                required: [has_active_subscription]
                properties:
                  has_active_subscription:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/v1/subscriptions/entitlement:
    get:
      summary: Subscription entitlement for full-book generation (UI)
      description: >
        Use for gating POST full-book generation and cooldown messaging.
        Pair with active-check for simple boolean gating.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Entitlement snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionEntitlement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Subscription:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        user_id:
          type: integer
          format: int64
        plan:
          type: string
          enum: [single_book, double_book, triple_book]
        expired:
          type: boolean
        books_remaining:
          type: integer
          minimum: 0
        last_full_generation_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionEntitlement:
      type: object
      required:
        - has_entitlement
        - can_start_full_generation
        - books_remaining
        - plan
        - subscription_public_id
        - multi_book_cooldown_seconds
      properties:
        has_entitlement:
          type: boolean
        can_start_full_generation:
          type: boolean
        books_remaining:
          type: integer
          minimum: 0
        plan:
          type: string
        subscription_public_id:
          type: string
          format: uuid
        next_full_generation_after:
          type: string
          format: date-time
          nullable: true
        multi_book_cooldown_seconds:
          type: integer
          minimum: 0

    ErrorBody:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
